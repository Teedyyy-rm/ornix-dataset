name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg (real decode + codec-admission integration tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install (core + dsp/export/hf/onnxruntime + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dsp,export,hf,vad,dev]"
      - name: Run test suite (offline; real-model tests self-skip)
        env:
          PYTHONPATH: src:tests
        run: pytest -q
