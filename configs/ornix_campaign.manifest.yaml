# Ornix multi-dataset campaign manifest (driver: scripts/run_ornix_campaign.py).
#
# Full-scale curation of 9 Vietnamese speech datasets into ONE unified
# canonical tree, then a gated publish to the destination repo.
# (FPT FOSD is NOT here: use configs/ornix_campaign.small9.yaml, which includes
# it. Its parquet embeds MP3, so it needs ORNIX_WAV_ONLY=0 — see that file.)
# Layout/columns/licenses below were PROBED from the Hub (2026-09-27), not guessed.
#
# Rights are OPERATOR-DECLARED here, never inferred by the tool:
#  - Datasets carrying a public license (MIT / CC-BY / CC-BY-SA / CC-BY-NC*) are
#    declared REDISTRIBUTION_APPROVED with the commercial flag matching the license
#    (NC => commercial "false").
#  - hatrang-voice-4h, luna_vi, vi_voice_female carry NO license on the Hub and
#    are declared REDISTRIBUTION_APPROVED on the operator's explicit assertion
#    of redistribution rights (hatrang: 2026-09-25; luna_vi + vi_voice_female:
#    2026-09-27), conservatively marked commercial "false" and license
#    "UNSPECIFIED-OPERATOR-DECLARED".
#
# consent_scope is the OPERATOR-DECLARED verified consent scope carried onto every
# accepted row and into the Ornix-TTS handoff manifest (manifest.jsonl). It
# follows the declared `commercial` flag, never the license shape:
#   commercial "true"  -> research-and-commercial
#   commercial "false" -> research   (covers every NC / unspecified source)
# Never inferred by the tool.
#
# speaker.mode:
#   fixed  -> every clip of this source shares one speaker id (ref below)
#   column -> per-row speaker taken from the dataset's `speaker` column
#   none   -> no speaker ref (each clip becomes its own anonymous speaker)

destination:
  repo_id: Teedyyy-rm/Ornix-Datasets
  repo_type: dataset

defaults:
  language: vi
  audio_col: audio
  min_free_gib: 25          # stop-safe: pause a dataset if free disk drops below this

datasets:
  - name: thanhpahm_tts
    repo: toandev/ThanhPahm-TTS
    format: parquet
    parquet_prefix: data
    text_col: transcription
    speaker: {mode: fixed, ref: thanh_pham}
    rights: {consent_scope: research, status: REDISTRIBUTION_APPROVED, redistribute: true, commercial: "false", license: CC-BY-NC-SA-4.0, note: "ThanhPahm-TTS CC-BY-NC-SA-4.0; attribution + NC + share-alike"}

  - name: ngochuyen_vivoice
    repo: thangnzt/NgocHuyenViVoice
    format: parquet
    parquet_prefix: data
    text_col: text
    speaker: {mode: fixed, ref: ngoc_huyen_vivoice}
    rights: {consent_scope: research-and-commercial, status: REDISTRIBUTION_APPROVED, redistribute: true, commercial: "true", license: MIT, note: "NgocHuyenViVoice MIT"}

  - name: ngochuyen_voice
    repo: pnnbao-ump/ngochuyen_voice
    format: parquet
    parquet_prefix: data
    text_col: transcription
    speaker: {mode: fixed, ref: ngoc_huyen_voice}
    rights: {consent_scope: research, status: REDISTRIBUTION_APPROVED, redistribute: true, commercial: "false", license: CC-BY-NC-4.0, note: "ngochuyen_voice CC-BY-NC-4.0; NC"}

  - name: vietbiblevox
    repo: ntt123/VietBibleVox-aligned
    format: parquet
    parquet_prefix: ""        # shards are part_000.parquet at repo root
    text_col: text
    speaker: {mode: fixed, ref: thanh_nam}
    rights: {consent_scope: research-and-commercial, status: REDISTRIBUTION_APPROVED, redistribute: true, commercial: "true", license: CC-BY-SA-4.0, note: "VietBibleVox-aligned CC-BY-SA-4.0; share-alike"}

  - name: hatrang_voice
    repo: quocs/hatrang-voice-4h
    format: loose
    loose_audio_prefix: raw_audio/
    loose_meta: raw_audio/metadata.jsonl        # {file_name, transcription}
    loose_meta_kind: jsonl
    text_col: transcription
    file_col: file_name
    speaker: {mode: fixed, ref: ha_trang}
    rights: {consent_scope: research, status: REDISTRIBUTION_APPROVED, redistribute: true, commercial: "false", license: UNSPECIFIED-OPERATOR-DECLARED, note: "no Hub license; operator asserts redistribution rights 2026-09-25"}

  - name: luna_vi
    repo: TuNguyen1101/luna_vi
    format: loose
    loose_audio_prefix: data/
    loose_meta: metadata.csv                    # header: file_name,text,language,index
    loose_meta_kind: csv
    text_col: text
    file_col: file_name
    speaker: {mode: fixed, ref: luna}
    rights: {consent_scope: research, status: REDISTRIBUTION_APPROVED, redistribute: true, commercial: "false", license: UNSPECIFIED-OPERATOR-DECLARED, note: "no Hub license; operator asserts redistribution rights 2026-09-27"}

  - name: vi_voice_female
    repo: vuihocrnd/vi_voice_female
    format: parquet
    parquet_prefix: data
    text_col: text_norm                         # normalized (digits expanded); raw `text` kept out
    speaker: {mode: fixed, ref: hong_hanh}
    rights: {consent_scope: research, status: REDISTRIBUTION_APPROVED, redistribute: true, commercial: "false", license: UNSPECIFIED-OPERATOR-DECLARED, note: "no Hub license; operator asserts redistribution rights 2026-09-27"}

  - name: w2wmovie_voice_2
    repo: thanghp456/W2WMovie-Voice-2
    format: parquet
    parquet_prefix: data
    text_col: text
    speaker: {mode: fixed, ref: hong_ngan}
    rights: {consent_scope: research-and-commercial, status: REDISTRIBUTION_APPROVED, redistribute: true, commercial: "true", license: MIT, note: "W2WMovie-Voice-2 MIT"}

  - name: vieneu_tts_140h
    repo: pnnbao-ump/VieNeu-TTS-140h
    format: arrow                               # data-*.arrow at repo root
    text_col: text
    speaker: {mode: column, col: speaker}       # per-row ids (jellyfish1010_0052, ...)
    rights: {consent_scope: research, status: REDISTRIBUTION_APPROVED, redistribute: true, commercial: "false", license: CC-BY-NC-4.0, note: "VieNeu-TTS-140h CC-BY-NC-4.0; NC"}
